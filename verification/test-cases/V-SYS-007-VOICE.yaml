id: V-SYS-007-VOICE
requirement: ASTRA-SYS-007
title: Cockpit Voice Guidance and Visual HUD Alerts
purpose: Verify that procedural deviation generates localized voice guidance and visual alert banners.
preconditions:
  - LocalVoiceManager initialized
setup:
  - Trigger mock deviation event
inputs:
  - Deviation alert packet
procedure:
  - Deliver deviation to assistance engine
