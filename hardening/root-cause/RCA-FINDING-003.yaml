  intermediate_event: "Retention policy only evaluated on explicit manual maintenance invocation."
  basic_event: "Autonomous trigger hook missing between storage health telemetry evaluator and cache cleaner."
  root_cause: "Decoupled storage monitor lacked active event listener to trigger non-critical frame pruning when utilization exceeds 85%."
corrective_action: "Implement threshold-based prune trigger in StorageRetentionPolicy to discard transient debug frames while strictly preserving step verification evidence."
verification: "Regression test tests/regression/test_storage_pruning_policy.py confirms non-critical buffers purged and evidence intact."
disposition: "RESOLVED"
