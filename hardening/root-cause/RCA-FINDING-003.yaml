finding_id: "FINDING-003"
title: "Storage capacity threshold pruning trigger"
analysis_method: "FAULT_TREE"
symptom: "Storage threshold warnings generated repeated notices without reclaiming diagnostic buffer disk space."
reproduction_case: "Simulate storage usage exceeding 85% and monitor whether non-critical preview cache is pruned."
evidence:
  - "reports/rehearsal/REH_07_STORAGE_WARNING_RUN_LOG"
  - "core/platform/storage.py"
root_cause_breakdown:
