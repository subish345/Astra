[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-ea"
version = "1.0.0"
description = "Autonomous Spacecraft Experiment Assurance & Assistance (SIH26174)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ASTRA-EA Engineering Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "psutil>=5.9.0",
    "pyttsx3>=2.90"
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0"
]
ai = [
    "torch>=2.0.0",
    "torchvision>=0.15.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
astra = "core.cli.commands:cli"

[tool.setuptools.packages.find]
include = ["core*", "streaming*", "apps*", "storage*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = [
    "tests"
]
