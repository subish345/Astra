    start_time: 0.5
    duration_sec: 2.0
    intensity: 0.70
  - fault_type: "GLARE"
    start_time: 2.5
    duration_sec: 1.5
    intensity: 0.75
  - fault_type: "LENS_SMUDGE"
    start_time: 4.0
    duration_sec: 2.0
    intensity: 0.60
expected_final_status: "UNCERTAIN"
expected_deviations: []
