scenario_id: "SIM_STRESS_OPTICAL"
name: "Environmental Degradation — Optical & Lighting Stress"
description: "Simulates severe cabin lighting drop, solar glare bloom, lens smudge, and sensor noise."
procedure_path: "configs/experiments/demo.yaml"
camera_profile: "VIEW_LEFT"
duration_sec: 6.0
target_fps: 30.0
synthetic_seed: 40004
faults:
