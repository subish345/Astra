# ==============================================================================
# DEMO PROCEDURE — NOT OFFICIAL SIH PROCEDURE
# This is a synthetic demonstrator procedure used for engineering verification.
# When official SIH26174 experiment steps are released, create a new YAML configuration
# without modifying any core Python source modules.
# ==============================================================================

experiment:
  id: "DEMO_EXP_001"
  name: "Sample Material Handling & Container Verification (DEMO)"
  version: "1.0.0"
  description: "Demonstration experiment for validating multimodal action assurance and deviation detection."
  author: "ASTRA-EA Ground Engineering Team"

objects:
  - id: "MAIN_BOX"
    name: "Main Experiment Container"
    category: "container"
    color: "blue"
    description: "Central experiment containment workstation"

  - id: "RED_BOX"
    name: "Specimen Reagent Red Box"
    category: "sample_container"
    color: "red"
    description: "Active reagent specimen box"

  - id: "YELLOW_BOX"
    name: "Auxiliary Buffer Yellow Box"
    category: "sample_container"
    color: "yellow"
    description: "Buffer reagent box (distractor for wrong-object deviation test)"

  - id: "WORK_SURFACE"
    name: "Experiment Work Surface"
    category: "zone"
    color: "gray"
    description: "Designated surface for specimen manipulation"

zones:
  - id: "EXPERIMENT_STATION"
    name: "Main Workstation Station Area"
    type: "rectangle"
    coordinates: [0.10, 0.10, 0.90, 0.90]
    description: "Operating envelope directly facing the main container workstation"

  - id: "WORK_SURFACE_ZONE"
    name: "Work Surface Manipulation Zone"
    type: "rectangle"
    coordinates: [0.25, 0.40, 0.75, 0.85]
    description: "Designated surface area for specimen placement"

steps:
  - id: "STEP_01"
    sequence: 1
    name: "Approach Experiment Station"
    description: "Astronaut approaches the experiment station and positions within the station zone"
    expected_objects:
      - "MAIN_BOX"
    expected_actions:
      - "APPROACH"
    required_evidence:
      - "ACTOR_DETECTED"
      - "OBJECT_DETECTED"
      - "SPATIAL_PROXIMITY"
      - "TEMPORAL_PRESENCE"
    optional_evidence:
      - "HAND_DETECTED"
    evidence_paths:
      any_of:
        - ["ACTOR_DETECTED", "OBJECT_DETECTED", "SPATIAL_PROXIMITY", "TEMPORAL_PRESENCE"]
    completion:
      type: "ENTER_ZONE"
      zone: "EXPERIMENT_STATION"
      minimum_duration_seconds: 2.0
    transitions:
      - "STEP_02"
    min_confidence: 0.75
    timeout_seconds: 30.0
    min_duration_seconds: 2.0
    repeatable: false
    criticality: "INFO"
    recovery:
      instruction: "Please position yourself directly in front of the experiment work area."
      target_step: "STEP_01"

  - id: "STEP_02"
    sequence: 2
    name: "Grasp Specimen Red Box"
    description: "Astronaut reaches for and firmly grasps the specimen Red Box"
    expected_objects:
      - "RED_BOX"
    expected_actions:
      - "REACH"
      - "GRASP"
    required_evidence:
      - "OBJECT_DETECTED"
      - "HAND_DETECTED"
      - "HAND_OBJECT_CONTACT"
    optional_evidence:
      - "COUPLED_MOTION"
    evidence_paths:
      any_of:
        - ["OBJECT_DETECTED", "HAND_DETECTED", "HAND_OBJECT_CONTACT"]
    transitions:
      - "STEP_03"
    min_confidence: 0.80
    timeout_seconds: 45.0
    min_duration_seconds: 1.5
    repeatable: false
    criticality: "WARNING"
    recovery:
      instruction: "Warning: Verify that you are grasping the RED box, not the auxiliary yellow box."
      target_step: "STEP_02"

  - id: "STEP_03"
    sequence: 3
    name: "Transfer Specimen to Work Surface"
    description: "Astronaut lifts, moves, approaches destination, and places Red Box onto work surface"
    expected_objects:
      - "RED_BOX"
      - "WORK_SURFACE"
    expected_actions:
      - "LIFT"
      - "MOVE"
      - "PLACE"
    action_sequence:
      - "LIFT"
      - "MOVE"
      - "APPROACH_DESTINATION"
      - "PLACE"
    destination:
      object: "WORK_SURFACE"
      zone: "WORK_SURFACE_ZONE"
      max_distance: 0.25
    stabilization:
      minimum_duration_seconds: 0.75
      maximum_position_delta: 0.05
    required_evidence:
      - "OBJECT_DETECTED"
      - "COUPLED_MOTION"
      - "DESTINATION_MATCH"
      - "OBJECT_STABILIZED"
    optional_evidence:
      - "HAND_OBJECT_CONTACT"
      - "TEMPORAL_CONSISTENCY"
    evidence_paths:
      any_of:
        - ["OBJECT_DETECTED", "COUPLED_MOTION", "DESTINATION_MATCH", "OBJECT_STABILIZED"]
    transitions:
      - "STEP_04"
    min_confidence: 0.80
    timeout_seconds: 60.0
    min_duration_seconds: 3.0
    repeatable: false
    criticality: "WARNING"
    recovery:
      instruction: "Place the Red Box firmly onto the center of the work surface."
      target_step: "STEP_03"

  - id: "STEP_04"
    sequence: 4
    name: "Release Specimen and Conclude Transfer"
    description: "Astronaut releases hand contact with the Red Box and withdraws hands"
    expected_objects:
      - "RED_BOX"
    expected_actions:
      - "RELEASE"
    required_evidence:
      - "OBJECT_DETECTED"
      - "CONTACT_CLEARED"
    optional_evidence:
      - "ACTOR_DETECTED"
      - "OBJECT_STABILIZED"
    evidence_paths:
      any_of:
        - ["OBJECT_DETECTED", "CONTACT_CLEARED"]
    transitions: []
    min_confidence: 0.75
    timeout_seconds: 30.0
    min_duration_seconds: 1.0
    repeatable: false
    criticality: "INFO"
    recovery:
      instruction: "Release your grip on the Red Box to complete the transfer step."
      target_step: "STEP_04"

transitions:
  STEP_01:
    next: ["STEP_02"]
  STEP_02:
    next: ["STEP_03"]
  STEP_03:
    next: ["STEP_04"]
  STEP_04:
    next: []
